<tr>
    <td>{{ row.test.done|date:"Y-m-d" }}</td>
    <td><a href="/test/{{ row.test.id }}/">{{ row.test.dev.name }}</a></td>
    <td>{{ row.elo|floatformat:2 }} &plusmn; {{ row.error|floatformat:2 }}</td>
    <td>{{ row.test.dev_time_control }}</td>
    <td>[{{ row.test.elolower }}, {{ row.test.eloupper }}]</td>
    <td>{% for tag in row.tags %}<a href="/search/?tags={{ tag|urlencode }}">{{ tag }}</a> {% endfor %}</td>
    <td>{{ row.notes }}</td>
</tr>
